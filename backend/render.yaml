# backend/render.yaml
services:
  - type: web
    name: micro-assurance-adi
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000